            schema:
              $ref: '#/components/schemas/SignInRequestDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponseDto_Output'
      tags:
        - Auth
  /me:
    get:
      operationId: getUser
      parameters: []
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto_Output'
