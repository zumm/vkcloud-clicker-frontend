  /gifts:
    get:
      operationId: getGifts
      parameters: []
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGiftsResponseDto_Output'
      security:
        - bearer: []
      tags:
